<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi - DompetKu</title>

    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

    <main class="auth-page">
        <section class="auth-card">

            <!-- Brand -->
            <div class="auth-brand">
                <div class="brand-icon">D</div>
                <span>DompetKu</span>
            </div>

            <!-- Heading -->
            <div class="auth-heading">
                <div class="auth-icon">👋</div>
                <h1>Buat Akun Baru</h1>
                <p>Daftarkan akun untuk mulai mengelola keuanganmu.</p>
            </div>

            <!-- Pesan Error -->
            <p class="message error"
               th:if="${error}"
               th:text="${error}">
            </p>

            <!-- Form Registrasi -->
            <form th:action="@{/register}"
                  th:object="${user}"
                  method="post">

                <!-- Nama Lengkap -->
                <div class="form-group">
                    <label for="name">Nama Lengkap</label>
                    <input
                        type="text"
                        id="name"
                        th:field="*{name}"
                        placeholder="Masukkan nama lengkap"
                        autocomplete="name"
                        required>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        th:field="*{email}"
                        placeholder="Masukkan email"
                        autocomplete="email"
                        required>
                </div>

                <!-- Nomor Telepon -->
                <div class="form-group">
                    <label for="phone">Nomor Telepon</label>
                    <input
                        type="tel"
                        id="phone"
                        th:field="*{phone}"
                        placeholder="Masukkan nomor telepon"
                        autocomplete="tel"
                        required>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="registerPassword">Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="registerPassword"
                            th:field="*{password}"
                            placeholder="Buat password"
                            autocomplete="new-password"
                            required>

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="registerPassword"
                            aria-label="Tampilkan password">

                            <svg class="eye-open"
                                 viewBox="0 0 24 24"
                                 aria-hidden="true">
                                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>

                            <svg class="eye-closed"
                                 viewBox="0 0 24 24"
                                 aria-hidden="true">
                                <path d="M3 3l18 18"/>
                                <path d="M10.6 10.6a2 2 0 002.8 2.8"/>
                                <path d="M9.9 5.2A11 11 0 0121 12a11 11 0 01-3.2 4.2"/>
                                <path d="M6.2 6.2A11 11 0 003 12a11 11 0 0018 0"/>
                            </svg>

                        </button>
                    </div>
                </div>

                <!-- Konfirmasi Password -->
                <div class="form-group">
                    <label for="confirmPassword">Konfirmasi Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Ulangi password"
                            autocomplete="new-password"
                            required>

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="confirmPassword"
                            aria-label="Tampilkan password">

                            <svg class="eye-open"
                                 viewBox="0 0 24 24"
                                 aria-hidden="true">
                                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>

                            <svg class="eye-closed"
                                 viewBox="0 0 24 24"
                                 aria-hidden="true">
                                <path d="M3 3l18 18"/>
                                <path d="M10.6 10.6a2 2 0 002.8 2.8"/>
                                <path d="M9.9 5.2A11 11 0 0121 12a11 11 0 01-3.2 4.2"/>
                                <path d="M6.2 6.2A11 11 0 003 12a11 11 0 0018 0"/>
                            </svg>

                        </button>
                    </div>
                </div>

                <!-- Tombol Daftar -->
                <button type="submit" class="auth-button">
                    Daftar
                </button>

            </form>

            <!-- Link Login -->
            <p class="auth-footer">
                Sudah punya akun?
                <a th:href="@{/login}">Login</a>
            </p>

        </section>
    </main>

    <!-- JavaScript Ikon Mata -->
    <script th:src="@{/js/auth.js}"></script>

</body>
</html>
