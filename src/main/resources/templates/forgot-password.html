<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password | DompetKu</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <a th:href="@{/login}" class="back-link">← Kembali ke Login</a>

            <div class="auth-brand">
                <div class="brand-icon">D</div>
                <span>DompetKu</span>
            </div>

            <div class="auth-heading">
                <div class="auth-icon">🔒</div>
                <h1>Lupa Password?</h1>
                <p>Masukkan email akunmu. Kami akan membuat kode OTP untuk proses pemulihan password.</p>
            </div>

            <p class="message error" th:if="${error}" th:text="${error}"></p>
            <p class="message success" th:if="${success}" th:text="${success}"></p>

            <form th:action="@{/forgot-password}" method="post">
                <div class="form-group">
                    <label for="email">Email Terdaftar</label>
                    <input type="email" id="email" name="email"
                           placeholder="nama@email.com" required>
                </div>

                <button type="submit" class="auth-button">
                    Buat Kode OTP
                </button>
            </form>

            <p class="auth-footer">
                Ingat password?
                <a th:href="@{/login}">Login sekarang</a>
            </p>
        </section>
    </main>
</body>
</html>
