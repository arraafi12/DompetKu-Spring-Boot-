<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | DompetKu</title>

    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

    <main class="auth-page">
        <section class="auth-card">

            <!-- Logo DompetKu -->
            <div class="auth-brand">
                <img th:src="@{/images/logo dompetku.png}"
                     alt="Logo DompetKu"
                     class="logo-dompetku">
            </div>

            <!-- Heading -->
            <div class="auth-heading">
                <h1>Selamat Datang!</h1>
                <p>Silakan masuk ke akun DompetKu Anda.</p>
            </div>

            <!-- Pesan Berhasil Registrasi -->
            <p class="message success" th:if="${param.registered}">
                Registrasi berhasil. Silakan login.
            </p>

            <!-- Pesan Berhasil Reset Password -->
            <p class="message success" th:if="${param.resetSuccess}">
                Password berhasil diubah. Silakan login dengan password baru.
            </p>

            <!-- Pesan Error -->
            <p class="message error"
               th:if="${error}"
               th:text="${error}">
            </p>

            <!-- Form Login -->
            <form th:action="@{/login}" method="post">

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Alamat Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Masukkan email Anda"
                        autocomplete="email"
                        required>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="loginPassword">Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Masukkan password"
                            autocomplete="current-password"
                            required>

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="loginPassword"
                            aria-label="Tampilkan password"
                            aria-pressed="false">

                            <!-- Ikon Mata Terbuka -->
                            <svg class="eye-open"
                                 viewBox="0 0 24 24"
                                 aria-hidden="true">
                                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>

                            <!-- Ikon Mata Dicoret -->
                            <svg class="eye-closed"
                                 viewBox="0 0 24 24"
                                 aria-hidden="true">
                                <path d="M3 3l18 18"/>
                                <path d="M10.6 10.6a2 2 0 002.8 2.8"/>
                                <path d="M9.9 5.2A11 11 0 0121 12a11 11 0 01-3.2 4.2"/>
                                <path d="M6.2 6.2A11 11 0 003 12a11 11 0 0018 0"/>
                            </svg>

                        </button>
                    </div>
                </div>

                <!-- Tombol Login -->
                <button type="submit" class="auth-button">
                    Login
                </button>

            </form>

            <!-- Link Pemulihan Email dan Password -->
            <div class="auth-links">
                <a th:href="@{/forgot-email}">
                    Lupa Email?
                </a>

                <a th:href="@{/forgot-password}">
                    Lupa Password?
                </a>
            </div>

            <!-- Garis Pemisah -->
            <div class="auth-divider"></div>

            <!-- Link Registrasi -->
            <p class="auth-footer">
                Belum punya akun?
                <a th:href="@{/register}">Daftar sekarang</a>
            </p>

        </section>
    </main>

    <!-- JavaScript Ikon Mata -->
    <script th:src="@{/js/auth.js}"></script>

</body>
</html>
