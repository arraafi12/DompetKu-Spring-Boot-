<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | DompetKu</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <a th:href="@{/forgot-password}" class="back-link">← Kembali</a>

            <div class="auth-brand">
                <div class="brand-icon">D</div>
                <span>DompetKu</span>
            </div>

            <div class="auth-heading">
                <div class="auth-icon">🔑</div>
                <h1>Buat Password Baru</h1>
                <p>Masukkan kode OTP dari CMD dan buat password baru untuk akunmu.</p>
            </div>

            <p class="message error" th:if="${error}" th:text="${error}"></p>

            <form th:action="@{/reset-password}" method="post">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email"
                           th:value="${email}" readonly required>
                </div>

                <div class="form-group">
                    <label for="otp">Kode OTP</label>
                    <input type="text" id="otp" name="otp"
                           placeholder="Masukkan 6 digit OTP"
                           inputmode="numeric" pattern="[0-9]{6}"
                           maxlength="6" required>
                </div>

                <div class="form-group">
                    <label for="newPassword">Password Baru</label>
                    <div class="password-wrapper">
                        <input type="password" id="newPassword"
                               name="newPassword"
                               placeholder="Minimal 8 karakter"
                               minlength="8" required>
                        <button type="button" class="toggle-password"
                                data-target="newPassword"
                                aria-label="Tampilkan password">◉</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Konfirmasi Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirmPassword"
                               name="confirmPassword"
                               placeholder="Ulangi password baru"
                               minlength="8" required>
                        <button type="button" class="toggle-password"
                                data-target="confirmPassword"
                                aria-label="Tampilkan password">◉</button>
                    </div>
                </div>

                <button type="submit" class="auth-button">
                    Simpan Password Baru
                </button>
            </form>
        </section>
    </main>

    <script th:src="@{/js/auth.js}"></script>
</body>
</html>
