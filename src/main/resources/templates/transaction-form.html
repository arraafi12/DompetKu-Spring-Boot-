<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Transaksi | DompetKu</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon">D</div>
            <span>DompetKu</span>
        </div>

        <p class="menu-label">MENU UTAMA</p>

        <nav>
            <a th:href="@{/}" class="nav-link">
                <span>▦</span> Dashboard
            </a>

            <a th:href="@{/transactions}" class="nav-link active">
                <span>↔</span> Transaksi
            </a>

            <a href="#reports" class="nav-link">
                <span>▤</span> Laporan
            </a>
        </nav>

        <div class="sidebar-bottom">
            <div class="profile">
                <div class="avatar">U</div>
                <div>
                    <strong>Pengguna</strong>
                    <small>Personal Account</small>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <header class="topbar">
            <div>
                <h1 th:text="${transaction.id == null ? 'Tambah Transaksi' : 'Edit Transaksi'}">
                    Form Transaksi
                </h1>
                <p>Masukkan informasi transaksi keuangan kamu.</p>
            </div>

            <div class="date-label">Keuangan Pribadi</div>
        </header>

        <!-- Form Section -->
        <section class="form-section">

            <form class="transaction-form"
                  th:action="@{/transactions/save}"
                  th:object="${transaction}"
                  method="post">

                <!-- ID Transaksi -->
                <input type="hidden" th:field="*{id}">

                <label>Tanggal Transaksi</label>
                <input type="date"
                       th:field="*{transactionDate}"
                       required>

                <label>Jenis Transaksi</label>
                <select th:field="*{type}" required>
                    <option value="">Pilih Jenis</option>
                    <option value="PEMASUKAN">Pemasukan</option>
                    <option value="PENGELUARAN">Pengeluaran</option>
                </select>

                <label>Kategori</label>
                <input type="text"
                       th:field="*{category}"
                       placeholder="Contoh: Makanan, Gaji, Transportasi"
                       required>

                <label>Jumlah Uang (Rp)</label>
                <input type="number"
                       th:field="*{amount}"
                       min="0.01"
                       step="0.01"
                       placeholder="Masukkan jumlah uang"
                       required>

                <label>Keterangan</label>
                <textarea th:field="*{description}"
                          placeholder="Tambahkan keterangan transaksi"></textarea>

                <div class="form-actions">
                    <button type="submit" class="save-button">
                        Simpan Transaksi
                    </button>

                    <a th:href="@{/transactions}" class="cancel-button">
                        Batal
                    </a>
                </div>

            </form>

        </section>

        <footer>
            © 2026 DompetKu. Kelola keuangan dengan lebih mudah.
        </footer>

    </main>

</div>

</body>
</html>
