<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Email | DompetKu</title>

    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

    <main class="auth-page">
        <section class="auth-card">

            <!-- Kembali ke Login -->
            <a th:href="@{/login}" class="back-link">
                ← Kembali ke Login
            </a>

            <!-- Logo DompetKu -->
            <div class="auth-brand">
                <img th:src="@{/images/logo dompetku.png}"
                     alt="Logo DompetKu"
                     class="logo-dompetku">
            </div>

            <!-- Heading -->
            <div class="auth-heading">
                <h1>Lupa Email?</h1>
                <p>
                    Masukkan nama dan nomor telepon yang terdaftar
                    untuk menemukan akunmu.
                </p>
            </div>

            <!-- Pesan Error -->
            <p class="message error"
               th:if="${error}"
               th:text="${error}">
            </p>

            <!-- Pesan Berhasil -->
            <p class="message success"
               th:if="${success}"
               th:text="${success}">
            </p>

            <!-- Hasil Email yang Ditemukan -->
            <div class="recovery-result" th:if="${recoveredEmail}">
                <p>Email akun yang ditemukan:</p>

                <strong th:text="${recoveredEmail}"></strong>

                <a th:href="@{/login}" class="auth-button">
                    Kembali ke Login
                </a>
            </div>

            <!-- Form Pencarian Email -->
            <form th:action="@{/forgot-email}"
                  method="post"
                  th:unless="${recoveredEmail}">

                <!-- Nama Lengkap -->
                <div class="form-group">
                    <label for="name">Nama Lengkap</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Masukkan nama lengkap"
                        autocomplete="name"
                        required>
                </div>

                <!-- Nomor Telepon -->
                <div class="form-group">
                    <label for="phone">Nomor Telepon</label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Masukkan nomor telepon terdaftar"
                        autocomplete="tel"
                        required>
                </div>

                <!-- Tombol Cari Email -->
                <button type="submit" class="auth-button">
                    Cari Email Saya
                </button>

            </form>

            <!-- Link Login -->
            <p class="auth-footer">
                Ingat email kamu?
                <a th:href="@{/login}">Login sekarang</a>
            </p>

        </section>
    </main>

</body>
</html>
